<!DOCTYPE html>
<html lang="es">
<head>

  <title>Conéctate con Nosotros</title>
  <style>

      font-family: sans-serif;
      text-align: center;
      background: #f7f7f7;

      padding: 30px;
      border-radius: 10px;

    }

      margin-top: 20px;

<body>
  <div class="container">
    <h1>¡Bienvenido!</h1>

  </div>
</body>
</html>
